<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Facial Recognition</title>

  <link rel="stylesheet" href="style.css">

  <script src="/libs/qimessaging/2/qimessaging.js"></script>
  <script src="tag.js"></script>
</head>

<body>

  <h1>Are you an existing user?</h1>

  <button
    type="button"
    onclick="goToDialogTag('existing_user')"
  >
    Yes, I am registered
  </button>

  <button
    type="button"
    onclick="goToDialogTag('new_user')"
  >
    No, I want to register
  </button>

  <button
    type="button"
    class="page-back-button"
    onclick="goToDialogTag('mainMenu')"
  >
    Back
  </button>

  <div id="status"></div>

</body>

</html>
