<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pepper Introduction</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="intro-page fade-in">

    <div class="intro-card">

      <h1>Hi I'm Pepper</h1>

      <p class="intro-text">
        Welcome to <strong>The Ballarat Tech School I'm here to help out</strong>
      </p>

      <p class="intro-text">
        To begin a conversation with me please say:
      </p>

      <div class="hello-box">
        "Hello"
      </div>

      <p class="intro-subtitle">
        The phrases I can recognize are:
      </p>

      <div class="phrase-grid">

        <div class="phrase-chip">Yes</div>
        <div class="phrase-chip">No</div>
        <div class="phrase-chip">Back</div>
        <div class="phrase-chip">1</div>
        <div class="phrase-chip">2</div>
        <div class="phrase-chip">3</div>

      </div>

    </div>

  </main>

</body>
</html>
