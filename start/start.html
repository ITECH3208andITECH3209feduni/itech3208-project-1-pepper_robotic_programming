<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start Conversation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="/libs/qimessaging/2/qimessaging.js"></script>
  <script src="tag.js"></script>
</head>

<body>

  <main class="start-page fade-in">

    <div class="start-card">

      <h1>Hi, I'm Pepper!</h1>

      <p class="start-subtitle">
        Welcome! I'm here to help you explore, learn and find information.
      </p>

      <div class="start-content">

        <p>
          I'm ready to have a conversation with you.
        </p>

        <p>
          When you're ready, press the button below to begin.
        </p>

      </div>

      <button
        class="start-button pepper-btn"
        onclick="goToDialogTag('conversationStart')">
        Press to Start Conversation
      </button>

    </div>

  </main>

</body>

</html>
