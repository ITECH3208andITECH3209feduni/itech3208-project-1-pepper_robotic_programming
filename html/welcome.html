<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Pepper Introduction</title>
  <link rel="stylesheet" href="style.css">
  
  <script src="/libs/qimessaging/2/qimessaging.js"></script>
  <script src="tag.js"></script>
 
  
</head>

<body>

  <main class="intro-page fade-in">



    <div class="intro-card">
    <button
      type="button"
      class="page-back-button"
      onclick="goToDialogTag('informationMenu')">
      Back
    </button>

      <h1>Hi I'm Pepper</h1>

      <p class="intro-text">
        Welcome to <strong>The Ballarat Tech School I'm here to help out</strong>
      </p>

      <p class="intro-text">
        To begin a conversation with me please say:
      </p>

      <div class="hello-box">
        "Hello"
      </div>

      <p class="intro-subtitle">
        The phrases I can recognize are:
      </p>

      <div class="phrase-grid">

        <div class="phrase-chip">Yes</div>
        <div class="phrase-chip">No</div>
        <div class="phrase-chip">Back</div>
        <div class="phrase-chip">1</div>
        <div class="phrase-chip">2</div>
        <div class="phrase-chip">3</div>
		
		

      </div>
		<p id="status">JavaScript has not started yet.</p>
    </div>


    

  </main>

</body>
</html>
