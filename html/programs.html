<!-- programs.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Programs</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  
  <script src="/libs/qimessaging/2/qimessaging.js"></script>
  <script src="tag.js"></script>
</head>
<body>


  <main class="tablet-page program-list-page fade-in">

    <button
        type="button"
        class="page-back-button"
        onclick="goToDialogTag('informationMenu')">
        Back
    </button>

    <header class="program-list-header">

        <h1 class="page-title program-list-title">
            Here are the available programs
        </h1>

        <p class="page-text program-list-description">
            Touch one of the program buttons below.
        </p>

    </header>

    <div class="program-list-content">

        <section class="program-section">

            <h2 class="section-title">
                Programs
            </h2>

            <div class="program-button-list">

                <button
                    class="program-button"
                    onclick="goToDialogTag('program1')">
                    3D Modelling
                </button>

                <button class="program-button">
                    Augmented Consciousness VCE Psychology
                </button>

                <button class="program-button">
                    Automation
                </button>

                <button class="program-button">
                    Boys in STEM
                </button>

                <button class="program-button">
                    Bushfood Innovations
                </button>

                <button class="program-button">
                    Game Design Online
                </button>

                <button class="program-button">
                    Game Maker
                </button>

                <button class="program-button">
                    Game of Drones Systems Engineering
                </button>

            </div>

        </section>

    </div>

   </main>

</body>
</html>
